<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | كنيسة الشهيد العظيم مارجرجس</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #0B132B; color: white; padding-top: 20px; }
        .sidebar a { color: #d1d5db; text-decoration: none; padding: 12px 20px; display: block; border-radius: 8px; margin-bottom: 5px; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background-color: rgba(212, 175, 55, 0.2); color: #D4AF37; }
        .login-container { max-width: 400px; margin: 100px auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div id="login-section" class="container">
        <div class="login-container text-center">
            <i class="fas fa-lock fs-1 mb-3" style="color: #D4AF37;"></i>
            <h3 class="mb-4">تسجيل دخول الإدارة</h3>
            <div class="alert alert-danger hidden" id="login-error"></div>
            <form id="login-form">
                <div class="mb-3 text-start">
                    <label class="form-label">اسم المستخدم</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn w-100" style="background-color: #D4AF37; color: #0B132B; font-weight: bold;">دخول</button>
            </form>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="container-fluid hidden">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar shadow-lg">
                <div class="text-center mb-4">
                    <i class="fas fa-church fs-1 mb-2" style="color: #D4AF37;"></i>
                    <h4>لوحة التحكم</h4>
                </div>
                <a href="#" class="active" data-target="pages-tab"><i class="fas fa-file-alt me-2"></i> الصفحات الرئيسية</a>
                <a href="#" data-target="services-tab"><i class="fas fa-list me-2"></i> الخدمات (23 خدمة)</a>
                <a href="/" target="_blank" class="mt-5"><i class="fas fa-external-link-alt me-2"></i> عرض الموقع</a>
                <a href="#" id="logout-btn" class="text-danger mt-2"><i class="fas fa-sign-out-alt me-2"></i> تسجيل خروج</a>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 id="dashboard-title">إدارة الصفحات الرئيسية</h2>
                    <span class="badge bg-success" id="save-status" style="opacity: 0; transition: opacity 0.5s;">تم الحفظ بنجاح</span>
                </div>

                <!-- Pages Editor -->
                <div id="pages-tab" class="tab-content">
                    <div class="row">
                        <div class="col-md-4">
                            <div class="list-group shadow-sm" id="pages-list">
                                <!-- Populated by JS -->
                            </div>
                        </div>
                        <div class="col-md-8">
                            <div class="card shadow-sm hidden" id="page-editor">
                                <div class="card-body">
                                    <h4 class="card-title mb-4">تعديل الصفحة</h4>
                                    <form id="page-form">
                                        <input type="hidden" id="edit-page-id">
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">عنوان الصفحة</label>
                                            <input type="text" id="edit-page-title" class="form-control" required>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">محتوى الصفحة (يدعم HTML الأساسي)</label>
                                            <textarea id="edit-page-content" class="form-control" rows="10" required></textarea>
                                        </div>
                                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> حفظ التعديلات</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Services Editor -->
                <div id="services-tab" class="tab-content hidden">
                    <div class="row">
                        <div class="col-md-4">
                            <div class="list-group shadow-sm" id="services-list" style="max-height: 80vh; overflow-y: auto;">
                                <!-- Populated by JS -->
                            </div>
                        </div>
                        <div class="col-md-8">
                            <div class="card shadow-sm hidden" id="service-editor">
                                <div class="card-body">
                                    <h4 class="card-title mb-4">تعديل الخدمة</h4>
                                    <form id="service-form">
                                        <input type="hidden" id="edit-service-id">
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">اسم الخدمة</label>
                                            <input type="text" id="edit-service-name" class="form-control" required>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">الأيقونة (FontAwesome)</label>
                                            <input type="text" id="edit-service-icon" class="form-control" required>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">محتوى وتفاصيل الخدمة (يدعم HTML)</label>
                                            <textarea id="edit-service-content" class="form-control" rows="12" required></textarea>
                                        </div>
                                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> حفظ التعديلات</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
